<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Java Exam Editor</title>
<script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: Arial, Helvetica, sans-serif; background: #f4f5f7; color: #1d2330; }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: #7a3b12; color: #fff; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #status { margin-right: auto; font-size: 13px; color: #f3dccb; }
  button { font-size: 14px; padding: 7px 16px; border: 0; border-radius: 5px; cursor: pointer; font-weight: 600; }
  #run { background: #2e9d4f; color: #fff; }
  #stop { background: #c0392b; color: #fff; }
  #clear { background: #e1e5ea; color: #1d2330; }
  button:disabled { opacity: .45; cursor: default; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; height: calc(100% - 50px); }
  .pane { display: flex; flex-direction: column; min-height: 0; background: #fff; border: 1px solid #cfd5dd; border-radius: 6px; overflow: hidden; }
  .right { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .right .pane { flex: 1; }
  .label { font-size: 12px; font-weight: 700; padding: 6px 10px; background: #e9edf2; border-bottom: 1px solid #cfd5dd; text-transform: uppercase; letter-spacing: .04em; }
  .label span { font-weight: 400; text-transform: none; letter-spacing: 0; color: #4a5568; }
  .editwrap { display: flex; flex: 1; min-height: 0; }
  #gutter { padding: 10px 6px 10px 8px; text-align: right; color: #8a94a3; background: #f7f8fa; border-right: 1px solid #e3e7ec; user-select: none; overflow: hidden; white-space: pre; }
  #gutter, #out { font-family: Consolas, Menlo, "Courier New", monospace; font-size: 15px; line-height: 1.45; }
  .codebox { position: relative; flex: 1; min-width: 0; }
  #code, #hl { position: absolute; inset: 0; margin: 0; border: 0; padding: 10px; white-space: pre; tab-size: 4; font-family: Consolas, Menlo, "Courier New", monospace; font-size: 15px; line-height: 1.45; letter-spacing: 0; word-spacing: 0; }
  #hl { overflow: hidden; color: #1d2330; pointer-events: none; background: #fff; }
  #code { overflow: auto; outline: none; resize: none; background: transparent; color: transparent; caret-color: #1d2330; z-index: 1; }
  #code::selection { background: rgba(122, 59, 18, .25); color: transparent; }
  .t-kw { color: #7c3aed; }
  .t-bi { color: #0b7285; }
  .t-str { color: #2e7d32; }
  .t-com { color: #8a8f98; font-style: italic; }
  .t-num { color: #c2410c; }
  .t-def { color: #1d4ed8; }
  .t-ann { color: #a16207; }
  #out { flex: 1; margin: 0; padding: 10px; overflow: auto; white-space: pre-wrap; word-break: break-word; background: #10151c; color: #e6edf3; }
  #out .err { color: #ff8a80; }
  #out .sys { color: #8fb3d9; }
  #out .in { color: #ffe08a; }
  #out input { font: inherit; color: #ffe08a; background: #1d2633; border: 0; border-bottom: 2px solid #ffe08a; outline: none; width: 55%; padding: 0 4px; }
  #guipane { display: none; }
  #guipane.show { display: flex; }
  #gui { flex: 1; min-height: 0; position: relative; background: #e9edf2; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Java Exam Editor</h1>
  <span id="status">Loading Java&hellip;</span>
  <button id="run" title="Run (Ctrl+Enter)" disabled>&#9654; Run</button>
  <button id="stop" disabled>&#9632; Stop</button>
  <button id="clear">Clear output</button>
</header>
<main>
  <section class="pane">
    <div class="label">Your code <span>&mdash; one file; put <b>public static void main</b> in your main class</span></div>
    <div class="editwrap">
      <div id="gutter">1</div>
      <div class="codebox">
        <pre id="hl" aria-hidden="true"></pre>
        <textarea id="code" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="Java code editor"></textarea>
      </div>
    </div>
  </section>
  <div class="right">
    <section class="pane">
      <div class="label">Output <span>&mdash; when your program asks for input, type here and press Enter</span></div>
      <pre id="out" aria-live="polite"></pre>
    </section>
    <section class="pane" id="guipane">
      <div class="label">GUI window <span>&mdash; your Swing window appears here</span></div>
      <div id="gui"></div>
    </section>
  </div>
</main>

  var CP = '/str/tools.jar:/str/examrt.jar';
  var TIME_LIMIT = 10000;

  var code = document.getElementById('code');
  var gutter = document.getElementById('gutter');
  var out = document.getElementById('out');
  var runBtn = document.getElementById('run');
  var stopBtn = document.getElementById('stop');
  var clearBtn = document.getElementById('clear');
  var statusEl = document.getElementById('status');
  var guiPane = document.getElementById('guipane');

  var ready = false, running = false, guiOpen = false;
  var stopFlag = 0, waiter = null;
  var compiled = { src: null, dir: null, ok: false }, buildNo = 0;
  var session = null;   // { inputs, shown, seed }
  var skip = 0;         // characters of output already shown (replayed runs print them again)
  var outChars = 0, MAX_OUT = 200000;

  // ---------- output ----------
  function write(text, cls) {
    if (outChars > MAX_OUT) return;
    outChars += text.length;
    if (outChars > MAX_OUT) { text = '\n[Output too long - stopped showing more]\n'; cls = 'sys'; }
    var span = document.createElement('span');
    if (cls) span.className = cls;
    span.textContent = text;
    out.appendChild(span);
    out.scrollTop = out.scrollHeight;
  }
  function programOut(s) {
    if (session) {
      if (skip > 0) {
        if (s.length <= skip) { skip -= s.length; return; }
        s = s.slice(skip); skip = 0;
      }
      session.shown += s.length;
    }
    write(s);
  }

  // ---------- Java side ----------
  // Each Java call ends when the runner reports back (done) or the JVM call returns (e.g. System.exit).
  var callNo = 0;
  function finished(code) { if (waiter) { var w = waiter; waiter = null; w.resolve(code); } }
  function javaCall(args) {
    return new Promise(function (resolve) {
      var id = ++callNo;
      waiter = { id: id, resolve: resolve };
      cheerpjRunMain.apply(null, ['examrt.ExamRunner', CP].concat(args)).then(function (c) {
        if (waiter && waiter.id === id) finished(c);
      });
    });
  }

  async function boot() {
    try {
      await cheerpjInit({
        version: 8, status: 'none', disableErrorReporting: true, disableLoadTimeReporting: true,
        natives: {
          async Java_examrt_ExamRunner_emit(lib, s) { programOut(s); },
          async Java_examrt_ExamRunner_emitErr(lib, s) { write(s.replace(/^[\w$]+\.java:(\d+): error:/gm, 'Line $1: error:'), 'err'); },
          async Java_examrt_ExamRunner_jsStop(lib) { return stopFlag; },
          async Java_examrt_ExamRunner_done(lib, c) { finished(c); }
        }
      });
      cheerpjCreateDisplay(-1, -1, document.getElementById('gui'));
      statusEl.textContent = 'Downloading the Java compiler…';
      var jar = await (await fetch(TOOLS_URL)).arrayBuffer();
      cheerpjAddStringFile('/str/tools.jar', new Uint8Array(jar));
      var rt = atob(RT_JAR), bytes = new Uint8Array(rt.length);
      for (var i = 0; i < rt.length; i++) bytes[i] = rt.charCodeAt(i);
      cheerpjAddStringFile('/str/examrt.jar', bytes);
      statusEl.textContent = 'Preparing the compiler (about 20-30 seconds)…';
      cheerpjAddStringFile('/str/Warm.java', new TextEncoder().encode('public class Warm { public static void main(String[] a) { int s = 0; for (int i = 0; i < 3; i++) s += i; System.out.println(s); } }'));
      await javaCall(['compile', '/files/warm/', '/str/Warm.java']);
      ready = true;
      setRunning(false);
    } catch (e) {
      statusEl.textContent = 'Java failed to load - reload the page';
      write('Java could not load: ' + e + '\n', 'err');
    }
  }

  function setRunning(on) {
    running = on;
    runBtn.disabled = !ready || on;
    stopBtn.disabled = !on && !guiOpen;
    if (!ready) return;
    statusEl.textContent = on ? 'Running… (press Stop if it does not finish)' : (guiOpen ? 'GUI window open - press Stop to close it' : 'Ready');
  }

  // Students write all their classes in one box. Java allows only one public top-level class per file,
  // so the "public" of the other top-level classes is blanked out (same length, so line/column numbers stay right)
  // and the file is named after the class that has main.
  function prepare(src) {
    var re = /\/\/[^\n]*|\/\*[\s\S]*?(?:\*\/|$)|"(?:[^"\\\n]|\\.)*"?|'(?:[^'\\\n]|\\.)*'?|[{}]|\b(?:public|class|interface|enum)\b|\b[A-Za-z_$][\w$]*\b/g;
    var depth = 0, m, pendingPublic = -1, types = [], expectName = null, startDepth = 0;
    while ((m = re.exec(src)) !== null) {
      var t = m[0];
      if (t === '{') { depth++; continue; }
      if (t === '}') { depth = Math.max(0, depth - 1); continue; }
      if (t[0] === '/' || t[0] === '"' || t[0] === "'") continue;
      if (depth !== 0) continue;
      if (expectName) { types.push({ name: t, pub: expectName.pub, at: expectName.at, pos: m.index }); expectName = null; pendingPublic = -1; continue; }
      if (t === 'public') { pendingPublic = m.index; continue; }
      if (t === 'class' || t === 'interface' || t === 'enum') { expectName = { pub: pendingPublic >= 0, at: pendingPublic }; continue; }
      if (t !== 'final' && t !== 'abstract' && t !== 'strictfp') pendingPublic = -1;
    }
    // the class holding main: the type declaration closest before the first "static void main"
    var mainAt = src.search(/\bstatic\s+void\s+main\s*\(/), mainType = null;
    types.forEach(function (ty) { if (mainAt < 0 || ty.pos < mainAt) mainType = ty; });
    if (!mainType) mainType = types.filter(function (ty) { return ty.pub; })[0] || types[0];
    var out = src;
    types.forEach(function (ty) {
      if (ty.pub && ty !== mainType) out = out.slice(0, ty.at) + '      ' + out.slice(ty.at + 6);
    });
    return { name: (mainType ? mainType.name : 'Main') + '.java', src: out };
  }

  async function closeGui() {
    if (!guiOpen) return;
    guiOpen = false;
    await javaCall(['close']);
    hideOldWindows();
    guiPane.classList.remove('show');
  }

  // A closed Swing window stays in the page, so hide it; otherwise the next Run shows old windows too.
  function hideOldWindows() {
    document.querySelectorAll('#gui .cjWindow').forEach(function (w) { w.style.display = 'none'; });
  }

  async function run() {
    if (runBtn.disabled) return;
    out.textContent = ''; outChars = 0;
    setRunning(true);
    await closeGui();
    var src = cleanCode(code.value);
    if (src !== code.value) { code.value = src; updateGutter(); highlight(); }
    if (src !== compiled.src) {
      statusEl.textContent = 'Compiling…';
      // /files/ is kept by the browser between visits, so every build gets a fresh folder name.
      var dir = '/files/b' + Date.now().toString(36) + '_' + (++buildNo) + '/';
      var prep = prepare(src);
      var path = '/str/' + prep.name;
      cheerpjAddStringFile(path, new TextEncoder().encode(prep.src));
      var rc = await javaCall(['compile', dir, path]);
      compiled = { src: src, dir: dir, ok: rc === 0 };
    }
    if (!compiled.ok) { write('\n--- Fix the errors above and press Run again ---\n', 'sys'); setRunning(false); return; }
    // Show the GUI area before a Swing program starts, so its window has room to draw.
    hideOldWindows();
    if (/javax\.swing|java\.awt/.test(src)) guiPane.classList.add('show');
    session = { inputs: [], shown: 0, seed: Math.floor(Math.random() * 1e9) };
    exec();
  }

  async function exec() {
    if (!session) return;
    stopFlag = 0;
    skip = session.shown;
    statusEl.textContent = 'Running… (press Stop if it does not finish)';
    var input = session.inputs.length ? session.inputs.join('\n') + '\n' : '';
    var rc = await javaCall(['run', input, compiled.dir, String(TIME_LIMIT), String(session.seed)]);
    if (!session) return;                       // stopped while waiting
    if (rc === 42) { askInput(); return; }
    if (rc === 45) {
      guiOpen = true;
      guiPane.classList.add('show');
      write('\n--- GUI window is open (below). Press Stop to close it ---\n', 'sys');
    } else if (rc === 43) {
      write('--- Program stopped ---\n', 'sys');
    } else if (rc === 44) {
      // message already shown
    } else {
      write('\n--- Program finished ---\n', 'sys');
    }
    if (!guiOpen) guiPane.classList.remove('show');
    session = null;
    setRunning(false);
  }

  function askInput() {
    statusEl.textContent = 'Waiting for your input…';
    var box = document.createElement('input');
    box.type = 'text';
    box.setAttribute('autocomplete', 'off');
    box.setAttribute('autocorrect', 'off');
    box.setAttribute('autocapitalize', 'off');
    box.spellcheck = false;
    box.setAttribute('aria-label', 'Program input');
    out.appendChild(box);
    out.scrollTop = out.scrollHeight;
    box.focus();
    box.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Enter' || !session) return;
      ev.preventDefault();
      var val = box.value;
      var echo = document.createElement('span');
      echo.className = 'in';
      echo.textContent = val + '\n';
      out.replaceChild(echo, box);
      session.inputs.push(val);
      exec();
    });
  }

  async function stop() {
    if (running && session) {
      var box = out.querySelector('input');
      if (box) {               // waiting for input: nothing is running in Java
        box.remove();
        session = null;
        write('\n--- Program stopped ---\n', 'sys');
        setRunning(false);
        return;
      }
      stopFlag = 1;            // the loop guard sees this within a fraction of a second
      return;
    }
    if (guiOpen) {
      await closeGui();
      write('--- GUI window closed ---\n', 'sys');
      setRunning(false);
    }
  }

  // Keep a draft in this browser tab only, so an accidental reload does not lose work.
  try { var saved = sessionStorage.getItem('javaexam_draft'); if (saved) code.value = saved; } catch (e) {}

  // Colour the code. Display only - no suggestions, no autocomplete.
  var hl = document.getElementById('hl');
  var KW = ' abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for goto if implements import instanceof int interface long native new package private protected public return short static strictfp super switch synchronized this throw throws transient try void volatile while var true false null ';
  var BI = ' String System Scanner Math Integer Double Character Boolean Long Object ArrayList List Arrays Random Exception RuntimeException ArithmeticException NumberFormatException InputMismatchException ArrayIndexOutOfBoundsException NullPointerException IllegalArgumentException JFrame JPanel JButton JLabel JTextField JTextArea JOptionPane JCheckBox JRadioButton JComboBox ButtonGroup FlowLayout BorderLayout GridLayout ActionListener ActionEvent Color Font Override ';
  var TOKEN = /("(?:[^"\\\n]|\\.)*"?|'(?:[^'\\\n]|\\.)*'?)|(\/\/[^\n]*|\/\*[\s\S]*?(?:\*\/|$))|(\b\d+(?:\.\d*)?(?:[eE][+-]?\d+)?[fFdDlL]?\b|\.\d+\b)|(@[A-Za-z_]\w*)|([A-Za-z_$][\w$]*)/g;
  function esc(t) { return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function highlight() {
    var src = code.value, html = '', last = 0, m, prevWord = '';
    TOKEN.lastIndex = 0;
    while ((m = TOKEN.exec(src)) !== null) {
      html += esc(src.slice(last, m.index));
      var t = m[0], cls = '';
      if (m[1]) cls = 't-str';
      else if (m[2]) cls = 't-com';
      else if (m[3]) cls = 't-num';
      else if (m[4]) cls = 't-ann';
      else if (m[5]) {
        if (prevWord === 'class' || prevWord === 'interface' || prevWord === 'enum') cls = 't-def';
        else if (KW.indexOf(' ' + t + ' ') >= 0) cls = 't-kw';
        else if (BI.indexOf(' ' + t + ' ') >= 0) cls = 't-bi';
        prevWord = t;
      }
      if (!m[5]) prevWord = '';
      html += cls ? '<span class="' + cls + '">' + esc(t) + '</span>' : esc(t);
      last = m.index + t.length;
    }
    html += esc(src.slice(last));
    hl.innerHTML = html + '\n';
    syncScroll();
  }
  function syncScroll() { hl.scrollTop = code.scrollTop; hl.scrollLeft = code.scrollLeft; gutter.scrollTop = code.scrollTop; }

  function updateGutter() {
    var n = code.value.split('\n').length, s = '';
    for (var i = 1; i <= n; i++) s += i + '\n';
    gutter.textContent = s;
    gutter.scrollTop = code.scrollTop;
  }
  // Code copied from Blackboard or a web page can carry invisible characters (non-breaking spaces,
  // zero-width spaces) and curly quotes that javac rejects as "illegal character". Replace them.
  function cleanCode(v) {
    return v.replace(/[\u00a0\u2000-\u200a\u202f\u205f\u3000]/g, ' ')
            .replace(/[\u200b-\u200d\u2060\ufeff\u00ad]/g, '')
            .replace(/[\u201c\u201d\u201e\u201f\u2033]/g, '"')
            .replace(/[\u2018\u2019\u201a\u201b\u2032]/g, "'")
            .replace(/[\u2013\u2014\u2212]/g, '-')
            .replace(/\r\n?/g, '\n');
  }
  code.addEventListener('input', function () {
    var c = cleanCode(code.value);
    if (c !== code.value) { var p = code.selectionStart; code.value = c; code.selectionStart = code.selectionEnd = Math.min(p, c.length); }
    updateGutter();
    highlight();
    try { sessionStorage.setItem('javaexam_draft', code.value); } catch (e) {}
  });
  code.addEventListener('scroll', syncScroll);

  // Tab inserts 4 spaces; Enter keeps the indentation (adds 4 after "{"); "}" on an empty line moves back 4.
  code.addEventListener('keydown', function (e) {
    var s = code.selectionStart, en = code.selectionEnd, v = code.value;
    var lineStart = v.lastIndexOf('\n', s - 1) + 1;
    if (e.key === 'Tab') {
      e.preventDefault();
      if (e.shiftKey) {
        var rm = v.substr(lineStart, 4).match(/^ {1,4}/);
        if (rm) { code.value = v.slice(0, lineStart) + v.slice(lineStart + rm[0].length); code.selectionStart = code.selectionEnd = Math.max(lineStart, s - rm[0].length); }
      } else {
        code.value = v.slice(0, s) + '    ' + v.slice(en);
        code.selectionStart = code.selectionEnd = s + 4;
      }
      code.dispatchEvent(new Event('input'));
    } else if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      var line = v.slice(lineStart, s);
      var indent = line.match(/^\s*/)[0];
      if (/\{\s*$/.test(line)) indent += '    ';
      code.value = v.slice(0, s) + '\n' + indent + v.slice(en);
      code.selectionStart = code.selectionEnd = s + 1 + indent.length;
      code.dispatchEvent(new Event('input'));
    } else if (e.key === '}' && s === en && /^ +$/.test(v.slice(lineStart, s))) {
      e.preventDefault();
      var cut = Math.min(4, s - lineStart);
      code.value = v.slice(0, s - cut) + '}' + v.slice(en);
      code.selectionStart = code.selectionEnd = s - cut + 1;
      code.dispatchEvent(new Event('input'));
    } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault(); run();
    }
  });

  runBtn.addEventListener('click', run);
  stopBtn.addEventListener('click', stop);
  clearBtn.addEventListener('click', function () { if (!running) { out.textContent = ''; outChars = 0; } });
  // Block the right-click menu outside the code box, so there is no "search the web" / "look up" option.
  document.addEventListener('contextmenu', function (e) { if (e.target !== code) e.preventDefault(); });
  if (!code.value) code.value = 'public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hello");\n    }\n}\n';
  updateGutter();
  highlight();
  boot();
  code.focus();
})();
</script>
</body>
</html>
