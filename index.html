<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Exam Editor</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: Arial, Helvetica, sans-serif; background: #f4f5f7; color: #1d2330; }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: #1f3a5f; color: #fff; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #status { margin-right: auto; font-size: 13px; color: #c9d6e6; }
  button { font-size: 14px; padding: 7px 16px; border: 0; border-radius: 5px; cursor: pointer; font-weight: 600; }
  #run { background: #2e9d4f; color: #fff; }
  #stop { background: #c0392b; color: #fff; }
  #clear { background: #e1e5ea; color: #1d2330; }
  button:disabled { opacity: .45; cursor: default; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; height: calc(100% - 50px); }
  .pane { display: flex; flex-direction: column; min-height: 0; background: #fff; border: 1px solid #cfd5dd; border-radius: 6px; overflow: hidden; }
  .label { font-size: 12px; font-weight: 700; padding: 6px 10px; background: #e9edf2; border-bottom: 1px solid #cfd5dd; text-transform: uppercase; letter-spacing: .04em; }
  .label span { font-weight: 400; text-transform: none; letter-spacing: 0; color: #4a5568; }
  .editwrap { display: flex; flex: 1; min-height: 0; }
  #gutter { padding: 10px 6px 10px 8px; text-align: right; color: #8a94a3; background: #f7f8fa; border-right: 1px solid #e3e7ec; user-select: none; overflow: hidden; white-space: pre; }
  #gutter, #out { font-family: Consolas, Menlo, "Courier New", monospace; font-size: 15px; line-height: 1.45; }
  .codebox { position: relative; flex: 1; min-width: 0; }
  #code, #hl { position: absolute; inset: 0; margin: 0; border: 0; padding: 10px; white-space: pre; tab-size: 4; font-family: Consolas, Menlo, "Courier New", monospace; font-size: 15px; line-height: 1.45; letter-spacing: 0; word-spacing: 0; }
  #hl { overflow: hidden; color: #1d2330; pointer-events: none; background: #fff; }
  #code { overflow: auto; outline: none; resize: none; background: transparent; color: transparent; caret-color: #1d2330; z-index: 1; }
  #code::selection { background: rgba(31, 58, 95, .25); color: transparent; }
  .t-kw { color: #7c3aed; }
  .t-bi { color: #0b7285; }
  .t-str { color: #2e7d32; }
  .t-com { color: #8a8f98; font-style: italic; }
  .t-num { color: #c2410c; }
  .t-def { color: #1d4ed8; }
  #out { flex: 1; margin: 0; padding: 10px; overflow: auto; white-space: pre-wrap; word-break: break-word; background: #10151c; color: #e6edf3; }
  #out .err { color: #ff8a80; }
  #out .sys { color: #8fb3d9; }
  #out .in { color: #ffe08a; }
  #out input { font: inherit; color: #ffe08a; background: #1d2633; border: 0; border-bottom: 2px solid #ffe08a; outline: none; width: 55%; padding: 0 4px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Python Exam Editor</h1>
  <span id="status">Loading Python&hellip;</span>
  <button id="run" title="Run (Ctrl+Enter)" disabled>&#9654; Run</button>
  <button id="stop" disabled>&#9632; Stop</button>
  <button id="clear">Clear output</button>
</header>
<main>
  <section class="pane">
    <div class="label">Your code</div>
    <div class="editwrap">
      <div id="gutter">1</div>
      <div class="codebox">
        <pre id="hl" aria-hidden="true"></pre>
        <textarea id="code" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="Python code editor"></textarea>
      </div>
    </div>
  </section>
  <section class="pane">
    <div class="label">Output <span>&mdash; when your program asks for input, type here and press Enter</span></div>
    <pre id="out" aria-live="polite"></pre>
  </section>
</main>

<!-- Python side: runs the student's program. Input is interactive: when the program needs a value
     that has not been typed yet, it stops, the page asks the student, and the program is replayed
     from the start with all answers so far (output that was already shown is not shown again). -->
<script type="text/plain" id="py-runner">
import sys, builtins, traceback, linecache, random

class _NeedInput(BaseException):
    pass

class _Out:
    def __init__(self, skip, emit):
        self.skip = skip
        self.emit = emit
        self.stopped = False
    def write(self, s):
        s = str(s)
        n = len(s)
        if self.stopped:
            return n
        if self.skip > 0:
            if n <= self.skip:
                self.skip -= n
                return n
            s = s[self.skip:]
            self.skip = 0
        if s:
            self.emit('out', s)
        return n
    def flush(self):
        pass
    def isatty(self):
        return False

class _Err:
    def __init__(self, emit):
        self.emit = emit
    def write(self, s):
        self.emit('err', str(s))
        return len(s)
    def flush(self):
        pass

def __exam_run(src, inputs, skip, seed, emit):
    inputs = list(inputs)
    state = {'i': 0, 'need': False}
    out = _Out(int(skip), emit)
    old_out, old_err = sys.stdout, sys.stderr
    sys.stdout = out
    sys.stderr = _Err(emit)
    random.seed(seed)

    # After the program has asked for input we do not have yet, stop it at the next line it runs,
    # even if the student's own try/except caught the stop signal.
    def tracer(frame, event, arg):
        if frame.f_code.co_filename != 'main.py':
            return None
        if event == 'line' and state['need']:
            raise _NeedInput()
        return tracer

    def arm():
        f = sys._getframe(1)
        while f is not None:
            if f.f_code.co_filename == 'main.py':
                f.f_trace = tracer
            f = f.f_back
        sys.settrace(tracer)

    def exam_input(prompt=''):
        if state['need']:
            raise _NeedInput()
        out.write(str(prompt))
        if state['i'] < len(inputs):
            v = inputs[state['i']]
            state['i'] += 1
            out.write(v + '\n')
            return v
        state['need'] = True
        out.stopped = True
        arm()
        raise _NeedInput()

    b = dict(builtins.__dict__)
    b['input'] = exam_input
    g = {'__name__': '__main__', '__builtins__': b}
    linecache.cache['main.py'] = (len(src), None, src.splitlines(True), 'main.py')
    result = 'done'
    try:
        exec(compile(src, 'main.py', 'exec'), g)
        if state['need']:
            result = 'need'
    except _NeedInput:
        result = 'need'
    except SystemExit:
        pass
    except BaseException as e:
        if state['need']:
            result = 'need'
        else:
            tb = e.__traceback__.tb_next if not isinstance(e, SyntaxError) else None
            sys.stderr.write(''.join(traceback.format_exception(type(e), e, tb)))
    finally:
        sys.settrace(None)
        sys.stdout, sys.stderr = old_out, old_err
    return result
</script>

<script type="text/plain" id="js-worker">
var py = null, runFn = null;
function emit(kind, s) { postMessage({ t: kind, s: s }); }
import(self.BASE + 'pyodide.mjs')
  .then(function (m) { return m.loadPyodide({ indexURL: self.BASE }); })
  .then(function (p) {
    py = p;
    py.runPython(self.RUNNER);
    runFn = py.globals.get('__exam_run');
    postMessage({ t: 'ready' });
  })
  .catch(function (e) { postMessage({ t: 'fail', s: String(e) }); });
onmessage = function (e) {
  var d = e.data, res = 'done';
  try {
    var inputs = py.toPy(d.inputs);
    res = runFn(d.code, inputs, d.skip, d.seed, emit);
    inputs.destroy();
  } catch (err) { emit('err', String(err)); }
  postMessage({ t: res === 'need' ? 'need' : 'done' });
};
</script>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var BASE = params.get('base') || 'https://cdn.jsdelivr.net/pyodide/v314.0.8/full/';
  var RUNNER = document.getElementById('py-runner').textContent;
  var WORKER = document.getElementById('js-worker').textContent;
  var code = document.getElementById('code');
  var gutter = document.getElementById('gutter');
  var out = document.getElementById('out');
  var runBtn = document.getElementById('run');
  var stopBtn = document.getElementById('stop');
  var clearBtn = document.getElementById('clear');
  var statusEl = document.getElementById('status');
  var worker = null, ready = false, running = false;
  var session = null;   // { code, inputs, shown, seed }
  var outChars = 0, MAX_OUT = 200000;

  function startWorker() {
    ready = false;
    runBtn.disabled = true;
    statusEl.textContent = 'Loading Python…';
    var src = 'self.BASE=' + JSON.stringify(BASE) + ';\nself.RUNNER=' + JSON.stringify(RUNNER) + ';\n' + WORKER;
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })), { type: 'module' });
    worker.onmessage = onMessage;
    worker.onerror = function () { statusEl.textContent = 'Python failed to load - reload the page'; };
  }

  function onMessage(e) {
    var m = e.data;
    if (m.t === 'ready') { ready = true; setRunning(false); }
    else if (m.t === 'out') { if (session) session.shown += m.s.length; write(m.s); }
    else if (m.t === 'err') write(m.s, 'err');
    else if (m.t === 'need') askInput();
    else if (m.t === 'done') { write('\n--- Program finished ---\n', 'sys'); session = null; setRunning(false); }
    else if (m.t === 'fail') { statusEl.textContent = 'Python failed to load - reload the page'; write('Python could not load: ' + m.s + '\n', 'err'); }
  }

  function write(text, cls) {
    if (outChars > MAX_OUT) return;
    outChars += text.length;
    if (outChars > MAX_OUT) { text = '\n[Output too long - stopped showing more]\n'; cls = 'sys'; }
    var span = document.createElement('span');
    if (cls) span.className = cls;
    span.textContent = text;
    out.appendChild(span);
    out.scrollTop = out.scrollHeight;
  }

  function askInput() {
    statusEl.textContent = 'Waiting for your input…';
    var box = document.createElement('input');
    box.type = 'text';
    box.setAttribute('autocomplete', 'off');
    box.setAttribute('autocorrect', 'off');
    box.setAttribute('autocapitalize', 'off');
    box.spellcheck = false;
    box.setAttribute('aria-label', 'Program input');
    out.appendChild(box);
    out.scrollTop = out.scrollHeight;
    box.focus();
    box.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Enter' || !session) return;
      ev.preventDefault();
      var val = box.value;
      var echo = document.createElement('span');
      echo.className = 'in';
      echo.textContent = val + '\n';
      out.replaceChild(echo, box);
      session.inputs.push(val);
      session.shown += val.length + 1;
      statusEl.textContent = 'Running… (press Stop if it does not finish)';
      send();
    });
  }

  function send() {
    worker.postMessage({ code: session.code, inputs: session.inputs, skip: session.shown, seed: session.seed });
  }

  function setRunning(on) {
    running = on;
    runBtn.disabled = !ready || on;
    stopBtn.disabled = !on;
    statusEl.textContent = on ? 'Running… (press Stop if it does not finish)' : (ready ? 'Ready' : 'Loading Python…');
  }

  function run() {
    if (runBtn.disabled) return;
    out.textContent = ''; outChars = 0;
    session = { code: code.value, inputs: [], shown: 0, seed: Math.floor(Math.random() * 1e9) };
    setRunning(true);
    send();
  }

  function stop() {
    if (!running) return;
    var box = out.querySelector('input');
    if (box) box.remove();
    write('\n--- Program stopped ---\n', 'sys');
    session = null;
    worker.terminate();
    running = false;
    stopBtn.disabled = true;
    startWorker();
  }

  // Keep a draft in this browser tab only, so an accidental reload does not lose work.
  try { var saved = sessionStorage.getItem('pyexam_draft'); if (saved) code.value = saved; } catch (e) {}

  // Colour the code (comments grey, keywords purple, strings green, numbers orange). Display only - no suggestions.
  var hl = document.getElementById('hl');
  var KW = ' False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case self ';
  var BI = ' print input int float str bool list dict tuple set range len sum min max abs round sorted reversed enumerate zip map filter open type isinstance super object format any all chr ord divmod pow id hex bin oct iter next Exception ValueError TypeError ZeroDivisionError IndexError KeyError NameError AttributeError NotImplementedError RuntimeError ';
  var TOKEN = /("""[\s\S]*?(?:"""|$)|'''[\s\S]*?(?:'''|$)|[rRbBfFuU]{0,2}"(?:[^"\\\n]|\\.)*"?|[rRbBfFuU]{0,2}'(?:[^'\\\n]|\\.)*'?)|(#[^\n]*)|(\b\d+(?:\.\d*)?(?:[eE][+-]?\d+)?j?\b|\.\d+\b)|([A-Za-z_][A-Za-z0-9_]*)/g;
  function esc(t) { return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function highlight() {
    var src = code.value, html = '', last = 0, m, prevWord = '';
    TOKEN.lastIndex = 0;
    while ((m = TOKEN.exec(src)) !== null) {
      html += esc(src.slice(last, m.index));
      var t = m[0], cls = '';
      if (m[1]) cls = 't-str';
      else if (m[2]) cls = 't-com';
      else if (m[3]) cls = 't-num';
      else if (m[4]) {
        if (prevWord === 'def' || prevWord === 'class') cls = 't-def';
        else if (KW.indexOf(' ' + t + ' ') >= 0) cls = 't-kw';
        else if (BI.indexOf(' ' + t + ' ') >= 0) cls = 't-bi';
        prevWord = t;
      }
      if (!m[4]) prevWord = '';
      html += cls ? '<span class="' + cls + '">' + esc(t) + '</span>' : esc(t);
      last = m.index + t.length;
    }
    html += esc(src.slice(last));
    hl.innerHTML = html + '\n';
    syncScroll();
  }
  function syncScroll() { hl.scrollTop = code.scrollTop; hl.scrollLeft = code.scrollLeft; gutter.scrollTop = code.scrollTop; }

  function updateGutter() {
    var n = code.value.split('\n').length, s = '';
    for (var i = 1; i <= n; i++) s += i + '\n';
    gutter.textContent = s;
    gutter.scrollTop = code.scrollTop;
  }
  code.addEventListener('input', function () {
    updateGutter();
    highlight();
    try { sessionStorage.setItem('pyexam_draft', code.value); } catch (e) {}
  });
  code.addEventListener('scroll', syncScroll);

  // Tab inserts 4 spaces; Enter keeps the current indentation (and adds 4 after a colon).
  code.addEventListener('keydown', function (e) {
    var s = code.selectionStart, en = code.selectionEnd, v = code.value;
    if (e.key === 'Tab') {
      e.preventDefault();
      if (e.shiftKey) {
        var ls = v.lastIndexOf('\n', s - 1) + 1;
        var rm = v.substr(ls, 4).match(/^ {1,4}/);
        if (rm) { code.value = v.slice(0, ls) + v.slice(ls + rm[0].length); code.selectionStart = code.selectionEnd = Math.max(ls, s - rm[0].length); }
      } else {
        code.value = v.slice(0, s) + '    ' + v.slice(en);
        code.selectionStart = code.selectionEnd = s + 4;
      }
      code.dispatchEvent(new Event('input'));
    } else if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      var lineStart = v.lastIndexOf('\n', s - 1) + 1;
      var line = v.slice(lineStart, s);
      var indent = line.match(/^\s*/)[0];
      if (/:\s*$/.test(line)) indent += '    ';
      code.value = v.slice(0, s) + '\n' + indent + v.slice(en);
      code.selectionStart = code.selectionEnd = s + 1 + indent.length;
      code.dispatchEvent(new Event('input'));
    } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault(); run();
    }
  });

  runBtn.addEventListener('click', run);
  stopBtn.addEventListener('click', stop);
  clearBtn.addEventListener('click', function () { if (!running) { out.textContent = ''; outChars = 0; } });
  // Block the right-click menu outside the code box, so there is no "search the web" / "look up" option.
  document.addEventListener('contextmenu', function (e) { if (e.target !== code) e.preventDefault(); });
  updateGutter();
  highlight();
  startWorker();
  code.focus();
})();
</script>
</body>
</html>
