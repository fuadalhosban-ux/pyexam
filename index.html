<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Exam Editor</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: Arial, Helvetica, sans-serif; background: #f4f5f7; color: #1d2330; }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: #1f3a5f; color: #fff; }
  header h1 { font-size: 16px; margin: 0 auto 0 0; font-weight: 600; }
  button { font-size: 14px; padding: 7px 16px; border: 0; border-radius: 5px; cursor: pointer; font-weight: 600; }
  #run { background: #2e9d4f; color: #fff; }
  #stop { background: #c0392b; color: #fff; }
  #clear { background: #e1e5ea; color: #1d2330; }
  button:disabled { opacity: .45; cursor: default; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; height: calc(100% - 50px); }
  .pane { display: flex; flex-direction: column; min-height: 0; background: #fff; border: 1px solid #cfd5dd; border-radius: 6px; overflow: hidden; }
  .label { font-size: 12px; font-weight: 700; padding: 6px 10px; background: #e9edf2; border-bottom: 1px solid #cfd5dd; text-transform: uppercase; letter-spacing: .04em; }
  .editwrap { display: flex; flex: 1; min-height: 0; }
  #gutter { padding: 10px 6px 10px 8px; text-align: right; color: #8a94a3; background: #f7f8fa; border-right: 1px solid #e3e7ec; user-select: none; overflow: hidden; white-space: pre; }
  #code, #gutter, #out { font-family: Consolas, "Courier New", monospace; font-size: 15px; line-height: 1.45; }
  #code { flex: 1; border: 0; outline: none; resize: none; padding: 10px; white-space: pre; overflow: auto; tab-size: 4; }
  #out { flex: 1; margin: 0; padding: 10px; overflow: auto; white-space: pre-wrap; word-break: break-word; background: #10151c; color: #e6edf3; }
  #out .err { color: #ff8a80; }
  #out .sys { color: #8fb3d9; }
  #out input { font: inherit; color: #ffe08a; background: transparent; border: 0; border-bottom: 1px dashed #ffe08a; outline: none; width: 60%; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Python Exam Editor</h1>
  <button id="run" title="Run (Ctrl+Enter)">&#9654; Run</button>
  <button id="stop" disabled>&#9632; Stop</button>
  <button id="clear">Clear output</button>
</header>
<main>
  <section class="pane">
    <div class="label">Your code</div>
    <div class="editwrap">
      <div id="gutter">1</div>
      <textarea id="code" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="Python code editor"></textarea>
    </div>
  </section>
  <section class="pane">
    <div class="label">Output</div>
    <pre id="out" aria-live="polite"></pre>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js" integrity="sha384-xKdsXwmsmIOznHB5nMknv/xlle/iCeNcEabalNUx5oSJIBHdxM1Qfnb50Y/w1zRU" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js" integrity="sha384-b3ccRbwiT8uaTe6Waa6GHLF96Yp3wDxTEVKf885pMqeZUqj4hG2zY3rwMD7WmX1g" crossorigin="anonymous"></script>
<script>
(function () {
  var code = document.getElementById('code');
  var gutter = document.getElementById('gutter');
  var out = document.getElementById('out');
  var runBtn = document.getElementById('run');
  var stopBtn = document.getElementById('stop');
  var clearBtn = document.getElementById('clear');
  var stopRequested = false;
  var pendingInput = null;
  var KEY = 'pyexam_draft';

  // Keep a draft in this browser tab only, so an accidental reload does not lose work.
  try { var saved = sessionStorage.getItem(KEY); if (saved) code.value = saved; } catch (e) {}

  function updateGutter() {
    var n = code.value.split('\n').length, s = '';
    for (var i = 1; i <= n; i++) s += i + '\n';
    gutter.textContent = s;
    gutter.scrollTop = code.scrollTop;
  }
  code.addEventListener('input', function () {
    updateGutter();
    try { sessionStorage.setItem(KEY, code.value); } catch (e) {}
  });
  code.addEventListener('scroll', function () { gutter.scrollTop = code.scrollTop; });

  // Tab inserts 4 spaces; Enter keeps the current indentation (and adds 4 after a colon).
  code.addEventListener('keydown', function (e) {
    var s = code.selectionStart, en = code.selectionEnd, v = code.value;
    if (e.key === 'Tab') {
      e.preventDefault();
      if (e.shiftKey) {
        var ls = v.lastIndexOf('\n', s - 1) + 1;
        var rm = v.substr(ls, 4).match(/^ {1,4}/);
        if (rm) { code.value = v.slice(0, ls) + v.slice(ls + rm[0].length); code.selectionStart = code.selectionEnd = Math.max(ls, s - rm[0].length); }
      } else {
        code.value = v.slice(0, s) + '    ' + v.slice(en);
        code.selectionStart = code.selectionEnd = s + 4;
      }
      code.dispatchEvent(new Event('input'));
    } else if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      var lineStart = v.lastIndexOf('\n', s - 1) + 1;
      var line = v.slice(lineStart, s);
      var indent = line.match(/^\s*/)[0];
      if (/:\s*$/.test(line)) indent += '    ';
      code.value = v.slice(0, s) + '\n' + indent + v.slice(en);
      code.selectionStart = code.selectionEnd = s + 1 + indent.length;
      code.dispatchEvent(new Event('input'));
    } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault(); run();
    }
  });

  function write(text, cls) {
    var span = document.createElement('span');
    if (cls) span.className = cls;
    span.textContent = text;
    out.appendChild(span);
    out.scrollTop = out.scrollHeight;
  }

  function askInput(prompt) {
    return new Promise(function (resolve) {
      if (prompt) write(String(prompt));
      var box = document.createElement('input');
      box.type = 'text'; box.setAttribute('autocomplete', 'off'); box.spellcheck = false;
      out.appendChild(box);
      box.focus();
      pendingInput = { box: box, resolve: resolve };
      box.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          var val = box.value;
          var echo = document.createElement('span');
          echo.textContent = val + '\n';
          echo.style.color = '#ffe08a';
          out.replaceChild(echo, box);
          pendingInput = null;
          resolve(val);
        }
      });
    });
  }

  function builtinRead(x) {
    if (Sk.builtinFiles === undefined || Sk.builtinFiles.files[x] === undefined)
      throw "File not found: '" + x + "'";
    return Sk.builtinFiles.files[x];
  }

  function setRunning(on) {
    runBtn.disabled = on; stopBtn.disabled = !on; code.readOnly = on;
  }

  function run() {
    if (runBtn.disabled) return;
    out.textContent = '';
    stopRequested = false;
    setRunning(true);
    Sk.configure({
      output: function (t) { write(t); },
      read: builtinRead,
      inputfun: askInput,
      inputfunTakesPrompt: true,
      __future__: Sk.python3,
      execLimit: null,
      yieldLimit: 100,
      killableWhile: true,
      killableFor: true
    });
    var p = Sk.misceval.asyncToPromise(function () {
      return Sk.importMainWithBody('<stdin>', false, code.value, true);
    }, {
      '*': function () { if (stopRequested) throw new Error('Program stopped.'); }
    });
    p.then(function () {
      write('\n--- Program finished ---\n', 'sys');
    }, function (err) {
      if (stopRequested) { write('\n--- Program stopped ---\n', 'sys'); return; }
      var msg = (err && err.toString) ? err.toString() : String(err);
      if (err && err.traceback && err.traceback.length) {
        var tb = err.traceback[0];
        if (tb && tb.lineno !== undefined && msg.indexOf('line') === -1) msg += ' on line ' + tb.lineno;
      }
      write('\n' + msg + '\n', 'err');
    }).then(function () { setRunning(false); });
  }

  function stop() {
    stopRequested = true;
    if (pendingInput) {
      var pi = pendingInput; pendingInput = null;
      if (pi.box.parentNode) pi.box.parentNode.removeChild(pi.box);
      pi.resolve('');
    }
  }

  runBtn.addEventListener('click', run);
  stopBtn.addEventListener('click', stop);
  clearBtn.addEventListener('click', function () { out.textContent = ''; });
  // Block the right-click menu so there is no "search the web" / "look up" option.
  document.addEventListener('contextmenu', function (e) { if (e.target !== code) e.preventDefault(); });
  updateGutter();
  code.focus();
})();
</script>
</body>
</html>
