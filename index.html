<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Exam Editor</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: Arial, Helvetica, sans-serif; background: #f4f5f7; color: #1d2330; }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: #1f3a5f; color: #fff; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #status { margin-right: auto; font-size: 13px; color: #c9d6e6; }
  button { font-size: 14px; padding: 7px 16px; border: 0; border-radius: 5px; cursor: pointer; font-weight: 600; }
  #run { background: #2e9d4f; color: #fff; }
  #stop { background: #c0392b; color: #fff; }
  #clear { background: #e1e5ea; color: #1d2330; }
  button:disabled { opacity: .45; cursor: default; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; height: calc(100% - 50px); }
  .col { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .pane { display: flex; flex-direction: column; min-height: 0; background: #fff; border: 1px solid #cfd5dd; border-radius: 6px; overflow: hidden; }
  .grow { flex: 1; }
  .label { font-size: 12px; font-weight: 700; padding: 6px 10px; background: #e9edf2; border-bottom: 1px solid #cfd5dd; text-transform: uppercase; letter-spacing: .04em; }
  .label span { font-weight: 400; text-transform: none; letter-spacing: 0; color: #4a5568; }
  .editwrap { display: flex; flex: 1; min-height: 0; }
  #gutter { padding: 10px 6px 10px 8px; text-align: right; color: #8a94a3; background: #f7f8fa; border-right: 1px solid #e3e7ec; user-select: none; overflow: hidden; white-space: pre; }
  #code, #gutter, #out, #stdin { font-family: Consolas, "Courier New", monospace; font-size: 15px; line-height: 1.45; }
  #code, #stdin { flex: 1; border: 0; outline: none; resize: none; padding: 10px; white-space: pre; overflow: auto; tab-size: 4; }
  #stdin { height: 110px; flex: none; background: #fffdf3; }
  #out { flex: 1; margin: 0; padding: 10px; overflow: auto; white-space: pre-wrap; word-break: break-word; background: #10151c; color: #e6edf3; }
  #out .err { color: #ff8a80; }
  #out .sys { color: #8fb3d9; }
  #out .in { color: #ffe08a; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Python Exam Editor</h1>
  <span id="status">Loading Python&hellip;</span>
  <button id="run" title="Run (Ctrl+Enter)" disabled>&#9654; Run</button>
  <button id="stop" disabled>&#9632; Stop</button>
  <button id="clear">Clear output</button>
</header>
<main>
  <div class="col">
    <section class="pane grow">
      <div class="label">Your code</div>
      <div class="editwrap">
        <div id="gutter">1</div>
        <textarea id="code" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="Python code editor"></textarea>
      </div>
    </section>
    <section class="pane">
      <div class="label">Input <span>&mdash; if your program uses input(), type the values here first, one per line</span></div>
      <textarea id="stdin" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="Program input"></textarea>
    </section>
  </div>
  <section class="pane">
    <div class="label">Output</div>
    <pre id="out" aria-live="polite"></pre>
  </section>
</main>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var BASE = params.get('base') || 'https://cdn.jsdelivr.net/pyodide/v314.0.8/full/';
  var code = document.getElementById('code');
  var stdinBox = document.getElementById('stdin');
  var gutter = document.getElementById('gutter');
  var out = document.getElementById('out');
  var runBtn = document.getElementById('run');
  var stopBtn = document.getElementById('stop');
  var clearBtn = document.getElementById('clear');
  var statusEl = document.getElementById('status');
  var worker = null, ready = false, running = false, outChars = 0;
  var MAX_OUT = 200000;

  // The worker runs real Python (Pyodide), so a stuck program can be stopped without freezing the page.
  var workerSrc = [
    "var py = null; var dec = new TextDecoder(); var buf = '';",
    "function flush(){ if (buf) { postMessage({t:'out', s:buf}); buf=''; } }",
    "var RUNNER = [",
    "'import sys, traceback, linecache',",
    "'def __exam_run(src):',",
    "'    g = {\"__name__\": \"__main__\"}',",
    "'    linecache.cache[\"main.py\"] = (len(src), None, src.splitlines(True), \"main.py\")',",
    "'    try:',",
    "'        exec(compile(src, \"main.py\", \"exec\"), g)',",
    "'    except SystemExit:',",
    "'        pass',",
    "'    except BaseException as e:',",
    "'        sys.stdout.flush()',",
    "'        tb = e.__traceback__.tb_next if isinstance(e, Exception) and not isinstance(e, SyntaxError) else None',",
    "'        sys.stderr.write(\"\".join(traceback.format_exception(type(e), e, tb)))',",
    "'    sys.stdout.flush()'",
    "].join('\\n');",
    "import(self.BASE + 'pyodide.mjs').then(function(m){ return m.loadPyodide({indexURL: self.BASE}); }).then(function(p){",
    "  py = p; py.runPython(RUNNER);",
    "  py.setStdout({ write: function(b){ buf += dec.decode(b, {stream:true}); if (buf.length > 2000 || buf.indexOf('\\n') >= 0) flush(); return b.length; } });",
    "  py.setStderr({ write: function(b){ flush(); postMessage({t:'err', s:dec.decode(b)}); return b.length; } });",
    "  postMessage({t:'ready'});",
    "}).catch(function(e){ postMessage({t:'fail', s:String(e)}); });",
    "onmessage = function(e){",
    "  var lines = e.data.input.replace(/\\r/g,'').split('\\n'); if (lines.length && lines[lines.length-1] === '') lines.pop();",
    "  var i = 0;",
    "  py.setStdin({ stdin: function(){ flush(); if (i < lines.length) { var v = lines[i++]; postMessage({t:'in', s:v}); return v + '\\n'; } postMessage({t:'noin'}); return null; }, isatty: false });",
    "  try { py.globals.get('__exam_run')(e.data.code); } catch (err) { flush(); postMessage({t:'err', s:String(err)}); }",
    "  flush(); postMessage({t:'done'});",
    "};"
  ].join('\n');

  function startWorker() {
    ready = false;
    runBtn.disabled = true;
    statusEl.textContent = 'Loading Python…';
    var blob = new Blob(['self.BASE=' + JSON.stringify(BASE) + ';\n' + workerSrc], { type: 'text/javascript' });
    worker = new Worker(URL.createObjectURL(blob), { type: 'module' });
    worker.onmessage = function (e) {
      var m = e.data;
      if (m.t === 'ready') { ready = true; statusEl.textContent = 'Ready'; if (!running) runBtn.disabled = false; }
      else if (m.t === 'out') write(m.s);
      else if (m.t === 'err') write(m.s, 'err');
      else if (m.t === 'in') write(m.s + '\n', 'in');
      else if (m.t === 'noin') write('\n[Your program asked for input, but the Input box has no more lines. Type the values in the Input box (one per line) and click Run again.]\n', 'err');
      else if (m.t === 'done') { write('\n--- Program finished ---\n', 'sys'); setRunning(false); }
      else if (m.t === 'fail') { statusEl.textContent = 'Python failed to load - reload the page'; write('Python could not load: ' + m.s + '\n', 'err'); }
    };
    worker.onerror = function (e) { statusEl.textContent = 'Python failed to load - reload the page'; };
  }

  function write(text, cls) {
    if (outChars > MAX_OUT) return;
    outChars += text.length;
    if (outChars > MAX_OUT) { text = text.slice(0, 200) + '\n[Output too long - stopped showing more]\n'; cls = 'sys'; }
    var span = document.createElement('span');
    if (cls) span.className = cls;
    span.textContent = text;
    out.appendChild(span);
    out.scrollTop = out.scrollHeight;
  }

  function setRunning(on) {
    running = on;
    runBtn.disabled = on || !ready;
    stopBtn.disabled = !on;
    statusEl.textContent = on ? 'Running… (press Stop if it does not finish)' : (ready ? 'Ready' : 'Loading Python…');
  }

  function run() {
    if (runBtn.disabled) return;
    out.textContent = ''; outChars = 0;
    setRunning(true);
    worker.postMessage({ code: code.value, input: stdinBox.value });
  }

  function stop() {
    if (!running) return;
    worker.terminate();
    write('\n--- Program stopped ---\n', 'sys');
    setRunning(false);
    startWorker();
  }

  // Keep a draft in this browser tab only, so an accidental reload does not lose work.
  try {
    var saved = sessionStorage.getItem('pyexam_draft'); if (saved) code.value = saved;
    var savedIn = sessionStorage.getItem('pyexam_input'); if (savedIn) stdinBox.value = savedIn;
  } catch (e) {}

  function updateGutter() {
    var n = code.value.split('\n').length, s = '';
    for (var i = 1; i <= n; i++) s += i + '\n';
    gutter.textContent = s;
    gutter.scrollTop = code.scrollTop;
  }
  code.addEventListener('input', function () {
    updateGutter();
    try { sessionStorage.setItem('pyexam_draft', code.value); } catch (e) {}
  });
  stdinBox.addEventListener('input', function () {
    try { sessionStorage.setItem('pyexam_input', stdinBox.value); } catch (e) {}
  });
  code.addEventListener('scroll', function () { gutter.scrollTop = code.scrollTop; });

  // Tab inserts 4 spaces; Enter keeps the current indentation (and adds 4 after a colon).
  code.addEventListener('keydown', function (e) {
    var s = code.selectionStart, en = code.selectionEnd, v = code.value;
    if (e.key === 'Tab') {
      e.preventDefault();
      if (e.shiftKey) {
        var ls = v.lastIndexOf('\n', s - 1) + 1;
        var rm = v.substr(ls, 4).match(/^ {1,4}/);
        if (rm) { code.value = v.slice(0, ls) + v.slice(ls + rm[0].length); code.selectionStart = code.selectionEnd = Math.max(ls, s - rm[0].length); }
      } else {
        code.value = v.slice(0, s) + '    ' + v.slice(en);
        code.selectionStart = code.selectionEnd = s + 4;
      }
      code.dispatchEvent(new Event('input'));
    } else if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      var lineStart = v.lastIndexOf('\n', s - 1) + 1;
      var line = v.slice(lineStart, s);
      var indent = line.match(/^\s*/)[0];
      if (/:\s*$/.test(line)) indent += '    ';
      code.value = v.slice(0, s) + '\n' + indent + v.slice(en);
      code.selectionStart = code.selectionEnd = s + 1 + indent.length;
      code.dispatchEvent(new Event('input'));
    } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault(); run();
    }
  });

  runBtn.addEventListener('click', run);
  stopBtn.addEventListener('click', stop);
  clearBtn.addEventListener('click', function () { out.textContent = ''; outChars = 0; });
  // Block the right-click menu outside the text boxes, so there is no "search the web" / "look up" option.
  document.addEventListener('contextmenu', function (e) { if (e.target !== code && e.target !== stdinBox) e.preventDefault(); });
  updateGutter();
  startWorker();
  code.focus();
})();
</script>
</body>
</html>
